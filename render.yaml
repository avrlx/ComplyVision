services:
  - type: web
    name: complyvision-testing-api
    runtime: python
    plan: free
    branch: complyvision-testing
    region: singapore
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt && COMPLYVISION_APP_ENV=testing python -c "from api.main import _testing_ocr_factory; _testing_ocr_factory()"
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: COMPLYVISION_APP_ENV
        value: testing
      - key: SIH_FRONTEND_ORIGINS
        sync: false
      - key: SIH_MAX_UPLOAD_BYTES
        value: "10485760"
